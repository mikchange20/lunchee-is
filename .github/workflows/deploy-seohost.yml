# Uploads the website to the SEOHOST server (lunchee.is) on every push to main.
# Needs 4 repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR (e.g. /domains/lunchee.is/public_html/)
# Until they are added, the job is skipped instead of failing.
name: Deploy to SEOHOST (lunchee.is)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-seohost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip if the server details are not set yet
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets not set yet – nothing uploaded."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Check the server details (shows only lengths and yes/no, never the values)
        if: env.FTP_SERVER != ''
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ secrets.FTP_SERVER_DIR }}
          S: ${{ secrets.FTP_SERVER }}
        run: |
          has_ws() { case "$1" in *[[:space:]]*) echo yes;; *) echo no;; esac; }
          echo "server: length ${#S}, spaces/newlines: $(has_ws "$S"), ends with seohost.pl: $(case "$S" in *seohost.pl) echo yes;; *) echo no;; esac)"
          echo "username: length ${#U}, spaces/newlines: $(has_ws "$U"), is deploy@lunchee.is: $([ "$U" = "deploy@lunchee.is" ] && echo yes || echo no)"
          echo "password: length ${#P}, spaces/newlines: $(has_ws "$P"), bytes: $(printf %s "$P" | wc -c | tr -d ' '), hidden/non-ASCII chars: $(printf %s "$P" | LC_ALL=C grep -q '[^ -~]' && echo yes || echo no), starts/ends with quote: $(case "$P" in \"*|*\"|\'*|*\') echo yes;; *) echo no;; esac)"
          echo "server dir: is ./ : $([ "$D" = "./" ] && echo yes || echo no)"

      - name: Upload to SEOHOST
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            CLAUDE.md
            DNS.md
