# Uploads the website to the SEOHOST server (lunchee.is) on every push to main.
# Needs 4 repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR (./ for the deploy@lunchee.is account)
# Until they are added, the job is skipped instead of failing.
# Uses lftp over FTPS (the server needs TLS on the data connection, which lftp handles well).
# Files are uploaded/overwritten; nothing on the server is deleted.
name: Deploy to SEOHOST (lunchee.is)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-seohost
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Skip if the server details are not set yet
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets not set yet – nothing uploaded."

      - uses: actions/checkout@v4
        if: env.FTP_SERVER != ''

      - name: Install lftp
        if: env.FTP_SERVER != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload to SEOHOST
        if: env.FTP_SERVER != ''
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u '$FTP_USER' '$FTP_SERVER';
            mirror --reverse --verbose --parallel=3 \
              --exclude-glob .git* --exclude-glob .github/ \
              --exclude-glob README.md --exclude-glob CLAUDE.md --exclude-glob DNS.md \
              ./ '$FTP_DIR'
          "
